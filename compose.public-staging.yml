name: bros-public-staging

x-runtime-environment: &runtime-environment
  APP_ENV: production
  DATABASE_URL_FILE: /run/secrets/database_url
  DB_POOL_MAX: ${DB_POOL_MAX:-8}
  API_HOST: 127.0.0.1
  API_PORT: 3000
  API_PUBLIC_ORIGIN: ${BROS_PUBLIC_ORIGIN:?Set BROS_PUBLIC_ORIGIN}
  API_LOCAL_UNAUTHENTICATED: "false"
  WORKER_CONCURRENCY: 1
  STORAGE_DRIVER: r2
  STORAGE_R2_ENDPOINT: ${STORAGE_R2_ENDPOINT:?Set STORAGE_R2_ENDPOINT}
  STORAGE_R2_BUCKET: ${STORAGE_R2_BUCKET:?Set STORAGE_R2_BUCKET}
  BROS_SECRET_STORAGE_R2_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key
  BROS_SECRET_STORAGE_R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_key

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bros}
      POSTGRES_USER: ${POSTGRES_USER:-bros}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend

  migrate:
    image: bros-public-staging-api
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: api
    restart: "no"
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,mode=1777"]
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    image: bros-public-staging-api
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      API_PROXY_AUTH_TOKEN_FILE: /run/secrets/proxy_token
    secrets: [database_url, proxy_token, r2_access_key, r2_secret_key]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,mode=1777"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend
      - edge

  identity-probe:
    image: bros-public-staging-api
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: api
    restart: unless-stopped
    command: ["node", "scripts/staging-identity-server.mjs"]
    environment:
      STAGING_IDENTITY_HOST: 127.0.0.1
      STAGING_IDENTITY_PORT: 3001
      BROS_PROXY_AUTH_TOKEN_FILE: /run/secrets/proxy_token
    secrets: [proxy_token]
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy

  edge:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: edge
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.staging", "--adapter", "caddyfile"]
    environment:
      BROS_API_PORT: 3000
      BROS_IDENTITY_PORT: 3001
    secrets: [caddy_auth, caddy_proxy]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
      identity-probe:
        condition: service_started
    configs:
      - source: staging_caddyfile
        target: /etc/caddy/Caddyfile.staging

  worker:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      BROS_BROWSER_PROFILE_ROOT: /srv/bros/profiles
      HOME: /tmp/bros-home
    secrets: [database_url, r2_access_key, r2_secret_key]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,mode=1777"]
    volumes:
      - browser_profiles:/srv/bros/profiles
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    shm_size: 512mb
    networks:
      - backend
      - egress

  tunnel:
    image: cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8080"]
    networks:
      - edge

configs:
  staging_caddyfile:
    file: ./ops/Caddyfile.public-staging

networks:
  backend:
    internal: true
  edge:
  egress:
secrets:
  database_url:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/database_url
  postgres_password:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/postgres_password
  proxy_token:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/proxy_token
  r2_access_key:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/r2_access_key
  r2_secret_key:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/r2_secret_key
  caddy_auth:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/caddy_auth
  caddy_proxy:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/caddy_proxy

volumes:
  browser_profiles:
