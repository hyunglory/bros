name: bros-production

x-runtime-environment: &runtime-environment
  APP_ENV: production
  DATABASE_URL_FILE: /run/secrets/database_url
  DB_POOL_MAX: ${DB_POOL_MAX:-8}
  DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
  DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
  API_HOST: 127.0.0.1
  API_PORT: 3000
  API_PUBLIC_ORIGIN: https://${BROS_PUBLIC_HOST:?Set BROS_PUBLIC_HOST}
  API_LOCAL_UNAUTHENTICATED: "false"
  API_READINESS_TIMEOUT_MS: ${API_READINESS_TIMEOUT_MS:-1000}
  API_SHUTDOWN_TIMEOUT_MS: ${API_SHUTDOWN_TIMEOUT_MS:-10000}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-15000}
  IMPORT_CHUNK_SIZE: ${IMPORT_CHUNK_SIZE:-100}
  IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-2}
  IMPORT_MAX_QUEUED_BATCHES: ${IMPORT_MAX_QUEUED_BATCHES:-32}
  STORAGE_DRIVER: r2
  STORAGE_R2_ENDPOINT: ${STORAGE_R2_ENDPOINT:?Set STORAGE_R2_ENDPOINT}
  STORAGE_R2_BUCKET: ${STORAGE_R2_BUCKET:?Set STORAGE_R2_BUCKET}
  BROS_SECRET_STORAGE_R2_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key
  BROS_SECRET_STORAGE_R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_key

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bros}
      POSTGRES_USER: ${POSTGRES_USER:-bros}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  migrate:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: api
    restart: "no"
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,mode=1777"]
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      API_PROXY_AUTH_TOKEN_FILE: /run/secrets/proxy_token
    secrets: [database_url, proxy_token, r2_access_key, r2_secret_key]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,mode=1777"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "${BROS_HTTP_BIND:-0.0.0.0}:${BROS_HTTP_PORT:-80}:80"
      - "${BROS_HTTPS_BIND:-0.0.0.0}:${BROS_HTTPS_PORT:-443}:443"
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  edge:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: edge
    restart: unless-stopped
    environment:
      BROS_PUBLIC_HOST: ${BROS_PUBLIC_HOST:?Set BROS_PUBLIC_HOST}
      BROS_ACME_EMAIL: ${BROS_ACME_EMAIL:?Set BROS_ACME_EMAIL}
      BROS_API_PORT: 3000
    secrets: [caddy_auth, caddy_proxy]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  worker:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      BROS_BROWSER_PROFILE_ROOT: /srv/bros/profiles
      HOME: /tmp/bros-home
    secrets: [database_url, r2_access_key, r2_secret_key]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,mode=1777"]
    volumes:
      - type: bind
        source: ${BROS_PROFILE_ROOT:?Set external private BROS_PROFILE_ROOT}
        target: /srv/bros/profiles
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    shm_size: 512mb
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

  backup:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: backup
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      STORAGE_R2_ENDPOINT: ${STORAGE_R2_ENDPOINT:?Set STORAGE_R2_ENDPOINT}
      STORAGE_R2_BUCKET: ${STORAGE_R2_BUCKET:?Set STORAGE_R2_BUCKET}
      BROS_SECRET_STORAGE_R2_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key
      BROS_SECRET_STORAGE_R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_key
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      BACKUP_STATUS_PATH: /var/lib/bros-backup/status.json
    secrets: [database_url, r2_access_key, r2_secret_key, backup_encryption_key]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=2g,mode=1777"]
    volumes:
      - backup_status:/var/lib/bros-backup
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "node", "scripts/check-database-backup-health.mjs"]
      interval: 15m
      timeout: 10s
      retries: 2
      start_period: 10m
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  backup-alert:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: backup
    restart: unless-stopped
    command: ["node", "scripts/run-backup-alert-dispatcher.mjs"]
    environment:
      APP_ENV: production
      BACKUP_ALERT_WEBHOOK_URL_FILE: /run/secrets/backup_alert_webhook_url
      BACKUP_ALERT_STATE_PATH: /var/lib/bros-backup-alert/state.json
      BACKUP_STATUS_PATH: /var/lib/bros-backup/status.json
    secrets: [backup_alert_webhook_url]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    volumes:
      - backup_status:/var/lib/bros-backup:ro
      - backup_alert_state:/var/lib/bros-backup-alert
    depends_on:
      backup:
        condition: service_started
    init: true
    networks:
      - egress
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_status:
  backup_alert_state:

networks:
  backend:
    internal: true
  egress:
secrets:
  database_url:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/database_url
  postgres_password:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/postgres_password
  proxy_token:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/proxy_token
  r2_access_key:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/r2_access_key
  r2_secret_key:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/r2_secret_key
  backup_encryption_key:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/backup_encryption_key
  backup_alert_webhook_url:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/backup_alert_webhook_url
  caddy_auth:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/caddy_auth
  caddy_proxy:
    file: ${BROS_SECRETS_DIR:?Set external private BROS_SECRETS_DIR}/caddy_proxy
